# Render blueprint: deploys the interactive problem-solving viewer
# (model/animation/serve.py) as a free web service.
#
# Use: push this repo to GitHub -> render.com -> New + -> Blueprint ->
# pick the repo. Render reads this file and creates the service.
# Then add the custom domain (problemsolving.fausto.ge) in the service's
# Settings -> Custom Domains, and create the CNAME it shows you at your
# DNS provider.

services:
  - type: web
    name: problem-solving-model
    runtime: python
    plan: free
    rootDir: model
    buildCommand: pip install -r requirements.txt
    startCommand: python animation/serve.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Fixed hash seed so a given `seed` value reproduces the exact same run
      # across server restarts (the model's RNG path is hash-sensitive).
      - key: PYTHONHASHSEED
        value: "0"
